# Builds the 3D board models from boards/*.kicad_pcb with KiCad, then deploys the site to GitHub Pages.
name: Build boards and deploy to Pages

on:
  push:
    branches: ["main", "ci/**"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

env:
  KICAD_IMAGE: kicad/kicad:10.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Collect 3D models for each board
        run: python3 .github/scripts/prepare_models.py

      # A failure here never blocks the site: the viewer falls back to its simplified 3D parts.
      - name: Export boards to GLB with KiCad
        continue-on-error: true
        run: |
          shopt -s nullglob
          for pcb in boards/*.kicad_pcb; do
            out="${pcb%.kicad_pcb}.raw.glb"
            echo "::group::Exporting $pcb"
            docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
              -v "$PWD:/work" -w /work \
              -e KICAD10_3DMODEL_DIR=/work/.kicad-3d \
              -e KICAD9_3DMODEL_DIR=/work/.kicad-3d \
              "$KICAD_IMAGE" \
              kicad-cli pcb export glb \
                --define-var KIPRJMOD=/work/boards \
                --define-var KICAD10_3DMODEL_DIR=/work/.kicad-3d \
                --define-var KICAD9_3DMODEL_DIR=/work/.kicad-3d \
                --subst-models --force \
                --include-tracks --include-pads --include-zones \
                --include-silkscreen --include-soldermask \
                --output "$out" "$pcb"
            ls -la "$out"
            echo "::endgroup::"
          done

      - name: Compress GLB files
        continue-on-error: true
        run: |
          shopt -s nullglob
          for raw in boards/*.raw.glb; do
            glb="${raw%.raw.glb}.glb"
            npx --yes @gltf-transform/cli@4 optimize "$raw" "$glb" \
              --compress meshopt --simplify false --texture-compress false || cp "$raw" "$glb"
            ls -la "$raw" "$glb"
            if [[ "$GITHUB_REF" == refs/heads/ci/* ]]; then mv "$raw" "${raw%.raw.glb}.kicad-raw.glb"; else rm "$raw"; fi
          done

      - name: Keep build files out of the site
        run: rm -rf .kicad-3d

      - name: Save board models for inspection
        uses: actions/upload-artifact@v4
        with:
          name: boards
          path: |
            boards/*.glb
            boards/*.models.json
          if-no-files-found: warn

      # Test branches only: publish the generated models to a scratch branch for inspection
      - name: Push models to scratch branch (ci/** only)
        if: startsWith(github.ref, 'refs/heads/ci/')
        run: |
          mkdir /tmp/out && cp boards/*.glb boards/*.models.json /tmp/out/ 2>/dev/null || true
          cd /tmp/out && git init -q -b models && git add . \
            && git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "models" \
            && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" models:ci-models

      - name: Setup Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload site
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
