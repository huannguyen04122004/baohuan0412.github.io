# Builds the 3D board models from boards/*.kicad_pcb with KiCad, then deploys the site to GitHub Pages.
name: Build boards and deploy to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  KICAD_IMAGE: kicad/kicad:10.0
  # camera for the hero picture: tilt (x), spin (z) in degrees, as KiCad's --rotate x,y,z
  HERO_ROTATE: "-35,25,-12"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Collect 3D models for each board
        run: python3 .github/scripts/prepare_models.py

      # A failure here never blocks the site: the viewer falls back to its simplified 3D parts.
      - name: Export boards to GLB with KiCad
        continue-on-error: true
        run: |
          shopt -s nullglob
          for pcb in boards/*.kicad_pcb; do
            out="${pcb%.kicad_pcb}.raw.glb"
            echo "::group::Exporting $pcb"
            docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
              -v "$PWD:/work" -w /work \
              -e KICAD10_3DMODEL_DIR=/work/.kicad-3d \
              -e KICAD9_3DMODEL_DIR=/work/.kicad-3d \
              "$KICAD_IMAGE" \
              kicad-cli pcb export glb \
                --define-var KIPRJMOD=/work/boards \
                --define-var KICAD10_3DMODEL_DIR=/work/.kicad-3d \
                --define-var KICAD9_3DMODEL_DIR=/work/.kicad-3d \
                --subst-models --force \
                --include-tracks --include-pads --include-zones \
                --include-silkscreen --include-soldermask \
                --output "$out" "$pcb"
            ls -la "$out"
            echo "::endgroup::"
          done

      # Picture for the top of the page, rendered by KiCad's raytracer from the current board
      - name: Render hero images with KiCad
        continue-on-error: true
        run: |
          shopt -s nullglob
          pip install --quiet pillow
          for pcb in boards/*.kicad_pcb; do
            png="${pcb%.kicad_pcb}.render.png"
            docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
              -v "$PWD:/work" -w /work \
              -e KICAD10_3DMODEL_DIR=/work/.kicad-3d \
              "$KICAD_IMAGE" \
              kicad-cli pcb render \
                --define-var KIPRJMOD=/work/boards \
                --define-var KICAD10_3DMODEL_DIR=/work/.kicad-3d \
                --side top --background transparent --quality high \
                --rotate "$HERO_ROTATE" --zoom 1 --width 1800 --height 1800 \
                --output "$png" "$pcb"
            python3 .github/scripts/trim_render.py "$png" "${pcb%.kicad_pcb}.render.webp"
            rm -f "$png"
          done

      - name: Compress GLB files
        continue-on-error: true
        run: |
          shopt -s nullglob
          for raw in boards/*.raw.glb; do
            glb="${raw%.raw.glb}.glb"
            npx --yes @gltf-transform/cli@4 optimize "$raw" "$glb" \
              --compress meshopt --simplify false --texture-compress false \
              --palette false --flatten false --join-named false --instance false || cp "$raw" "$glb"
            ls -la "$raw" "$glb"
            rm "$raw"
            # fingerprint the model so browsers never pair a new manifest with an old cached GLB
            python3 - "$glb" <<'PY'
          import hashlib, json, sys, pathlib
          glb = pathlib.Path(sys.argv[1])
          man = glb.with_name(glb.name[:-4] + ".models.json")
          data = json.loads(man.read_text()) if man.exists() else {}
          data["glb"] = glb.name
          data["version"] = hashlib.sha256(glb.read_bytes()).hexdigest()[:16]
          man.write_text(json.dumps(data, indent=2))
          print("fingerprint", data["version"])
          PY
          done

      - name: Keep build files out of the site
        run: rm -rf .kicad-3d

      - name: Save board models for inspection
        uses: actions/upload-artifact@v4
        with:
          name: boards
          path: |
            boards/*.glb
            boards/*.models.json
          if-no-files-found: warn

      - name: Setup Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload site
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
